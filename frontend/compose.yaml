name: ${FRONTEND_COMPOSE_PROJECT_NAME:-agent-frontend}

services:
  open-webui:
    image: ghcr.io/open-webui/open-webui:main
    restart: unless-stopped
    environment:
      WEBUI_URL: ${OPENWEBUI_PUBLIC_URL:?Set OPENWEBUI_PUBLIC_URL in .env}
      WEBUI_SECRET_KEY: ${OPENWEBUI_SECRET_KEY:?Set OPENWEBUI_SECRET_KEY in .env}
      ENABLE_SIGNUP: ${OPENWEBUI_ENABLE_SIGNUP:-false}
      ENABLE_OAUTH_SIGNUP: ${OPENWEBUI_ENABLE_OAUTH_SIGNUP:-true}
      ENABLE_OAUTH_PERSISTENT_CONFIG: ${OPENWEBUI_ENABLE_OAUTH_PERSISTENT_CONFIG:-false}
      OAUTH_MERGE_ACCOUNTS_BY_EMAIL: ${OPENWEBUI_OAUTH_MERGE_ACCOUNTS_BY_EMAIL:-true}
      ENABLE_OAUTH_ID_TOKEN_COOKIE: ${OPENWEBUI_ENABLE_OAUTH_ID_TOKEN_COOKIE:-false}
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:-}
      GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET:-}
      OPENID_PROVIDER_URL: ${OPENID_PROVIDER_URL:-https://accounts.google.com/.well-known/openid-configuration}
      GOOGLE_OAUTH_AUTHORIZE_PARAMS: '${GOOGLE_OAUTH_AUTHORIZE_PARAMS:-{"hd":"openformation.io"}}'
    volumes:
      - ./data/open-webui:/app/backend/data
    expose:
      - "8080"

  cloudflared:
    image: cloudflare/cloudflared:latest
    restart: unless-stopped
    command: tunnel --no-autoupdate run --token ${CLOUDFLARE_TUNNEL_TOKEN:?Set CLOUDFLARE_TUNNEL_TOKEN in .env}
    depends_on:
      - open-webui
