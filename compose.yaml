name: ${COMPOSE_PROJECT_NAME:-agents}

services:
  cloudflared:
    image: cloudflare/cloudflared:latest
    restart: unless-stopped
    command: tunnel --no-autoupdate run --token ${CLOUDFLARE_TUNNEL_TOKEN:?Set CLOUDFLARE_TUNNEL_TOKEN in .env}
    networks:
      - tunnel
      - egress

networks:
  tunnel:
    internal: true
  egress: {}
