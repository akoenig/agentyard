services:
  litellm-personal:
    image: docker.litellm.ai/berriai/litellm-database:main-stable
    container_name: personal-agent-litellm-personal
    restart: unless-stopped
    command: ["--config", "/app/config.yaml", "--port", "4000"]
    depends_on:
      postgres:
        condition: service_healthy
    expose:
      - "4000"
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/litellm_personal
      LITELLM_MASTER_KEY: ${LITELLM_PERSONAL_MASTER_KEY}
      LITELLM_SALT_KEY: ${LITELLM_PERSONAL_SALT_KEY}
      CHATGPT_TOKEN_DIR: /data/chatgpt
    volumes:
      - ./litellm/agents/personal/config.yaml:/app/config.yaml:ro
      - ./data/litellm/personal:/data

  hermes-personal:
    image: nousresearch/hermes-agent:latest
    container_name: personal-agent-hermes-personal
    restart: unless-stopped
    command: gateway run
    depends_on:
      - litellm-personal
    expose:
      - "8642"
    environment:
      OPENAI_API_BASE: http://litellm-personal:4000/v1
      OPENAI_API_KEY: ${HERMES_PERSONAL_LITELLM_KEY:-}
    volumes:
      - ./data/agents/personal:/opt/data
    shm_size: 1g
